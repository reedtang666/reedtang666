<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="100%" height="100%">
  <defs>
    <clipPath id="clip-cmd1">
      <rect x="200" y="58" height="26" class="type-cmd1" />
    </clipPath>
    <clipPath id="clip-cmd2">
      <rect x="200" y="128" height="26" class="type-cmd2" />
    </clipPath>
    <clipPath id="clip-cmd3">
      <rect x="200" y="272" height="26" class="type-cmd3" />
    </clipPath>
    <clipPath id="clip-cmd4">
      <rect x="200" y="338" height="26" class="type-cmd4" />
    </clipPath>
  </defs>

  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
    .header { fill: #161b22; }
    .divider { stroke: #30363d; stroke-width: 1; }
    .font {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace, 'PingFang SC', 'Microsoft YaHei';
      font-size: 14.5px;
      letter-spacing: 0.3px;
    }
    .title { fill: #6e7681; font-size: 13.5px; text-anchor: middle; }
    .prompt { fill: #3fb950; font-weight: 600; }
    .cmd { fill: #e6edf3; font-weight: 500; }
    .out { fill: #8b949e; }
    .repo { fill: #58a6ff; font-weight: 600; }
    .org { fill: #79c0ff; font-weight: 600; }
    .tag { fill: #ff7b72; font-weight: 600; }
    .cursor { fill: #c9d1d9; }

    .line1 { opacity: 0; animation: show 0.01s ease forwards 0.3s; }
    .type-cmd1 { width: 0; animation: type1 0.5s steps(6, end) forwards 0.5s; }
    .out1 { opacity: 0; animation: fadeIn 0.2s ease forwards 1.1s; }

    .line2 { opacity: 0; animation: show 0.01s ease forwards 1.4s; }
    .type-cmd2 { width: 0; animation: type2 1.1s steps(23, end) forwards 1.6s; }
    .out2 { opacity: 0; animation: fadeIn 0.2s ease forwards 2.8s; }

    .line3 { opacity: 0; animation: show 0.01s ease forwards 3.2s; }
    .type-cmd3 { width: 0; animation: type3 0.6s steps(10, end) forwards 3.4s; }
    .out3 { opacity: 0; animation: fadeIn 0.2s ease forwards 4.1s; }

    .line4 { opacity: 0; animation: show 0.01s ease forwards 4.4s; }
    .type-cmd4 { width: 0; animation: type4 0.5s steps(9, end) forwards 4.6s; }
    .out4 { opacity: 0; animation: fadeIn 0.2s ease forwards 5.2s; }

    .line5 { opacity: 0; animation: show 0.01s ease forwards 5.5s; }
    .blink { animation: blink 1s step-end infinite 5.5s; }

    @keyframes show { to { opacity: 1; } }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes type1 { to { width: 80px; } }
    @keyframes type2 { to { width: 260px; } }
    @keyframes type3 { to { width: 120px; } }
    @keyframes type4 { to { width: 110px; } }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <rect x="2" y="2" width="836" height="426" rx="10" ry="10" class="bg" />
  <path d="M 2 12 A 10 10 0 0 1 12 2 L 828 2 A 10 10 0 0 1 838 12 L 838 40 L 2 40 Z" class="header" />
  <line x1="2" y1="40" x2="838" y2="40" class="divider" />

  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />
  <text x="420" y="26" class="font title">reed@github: ~</text>

  <g class="font line1">
    <text x="28" y="76" class="prompt">reed@github:~$</text>
    <g clip-path="url(#clip-cmd1)">
      <text x="200" y="76" class="cmd">whoami</text>
    </g>
  </g>
  <g class="font out1">
    <text x="28" y="102" class="out">造轮子，折腾效率工具与全栈开发。CLI / DEVOPS / FULL-STACK / AI</text>
  </g>

  <g class="font line2">
    <text x="28" y="146" class="prompt">reed@github:~$</text>
    <g clip-path="url(#clip-cmd2)">
      <text x="200" y="146" class="cmd">ls projects/ --featured</text>
    </g>
  </g>
  <g class="font out2">
    <text x="28" y="172">
      <tspan class="org">9star-academy/ShellReady</tspan>
      <tspan class="out" dx="14">一条命令配好 Linux 服务器 (BBR/Starship/Atuin)</tspan>
      <tspan class="tag" dx="10">[Python]</tspan>
    </text>
    <text x="28" y="196">
      <tspan class="org">9star-academy/servctl</tspan>
      <tspan class="out" dx="39">一行命令将任意程序无缝托管为 systemd 自启服务</tspan>
      <tspan class="tag" dx="10">[Go]</tspan>
    </text>
    <text x="28" y="220">
      <tspan class="repo">flutter-easy-starter/</tspan>
      <tspan class="out" dx="48">Flutter 简易开箱即用框架，支持快速二次开发</tspan>
      <tspan class="tag" dx="10">[Dart]</tspan>
    </text>
    <text x="28" y="244">
      <tspan class="repo">BizGenesis/</tspan>
      <tspan class="out" dx="136">AI 创业加速器：从灵感到商业模式落地的全套工具</tspan>
      <tspan class="tag" dx="10">[AI]</tspan>
    </text>
  </g>

  <g class="font line3">
    <text x="28" y="290" class="prompt">reed@github:~$</text>
    <g clip-path="url(#clip-cmd3)">
      <text x="200" y="290" class="cmd">ls skills/</text>
    </g>
  </g>
  <g class="font out3">
    <text x="28" y="316" class="out">go  python  dart  flutter  vue3  typescript  linux  systemd  docker  github-actions</text>
  </g>

  <g class="font line4">
    <text x="28" y="356" class="prompt">reed@github:~$</text>
    <g clip-path="url(#clip-cmd4)">
      <text x="200" y="356" class="cmd">cat motto</text>
    </g>
  </g>
  <g class="font out4">
    <text x="28" y="382" class="out">把繁琐交给脚本，把时间留给创造。既然来了，就留下你的 Star 吧。</text>
  </g>

  <g class="font line5">
    <text x="28" y="412" class="prompt">reed@github:~$</text>
    <rect x="160" y="398" width="9" height="17" class="cursor blink" />
  </g>
</svg>
